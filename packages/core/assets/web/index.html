<style>
  :root {
    --aika-primary: #42B998;
    --aika-primary-dark: #35a082;
    --aika-turquoise: #2AA8A0;
    --aika-bg: #F8FAF9;
    --aika-card: #FFFFFF;
    --aika-text: #17211D;
    --aika-text-variant: #5F6B66;
    --aika-text-disabled: #8A9590;
    --aika-outline: #B9C5BF;
    --aika-outline-variant: #E1E8E4;
    --aika-secondary-container: #EAF3F0;
    --aika-error: #BA1A1A;
    --aika-error-container: #FFDAD6;
    --aika-radius-lg: 20px;
    --aika-radius-md: 14px;
    --aika-radius-sm: 10px;
    --aika-shadow: 0 1px 2px rgba(23, 33, 29, 0.06), 0 4px 16px rgba(23, 33, 29, 0.05);
    --aika-shadow-hover: 0 2px 6px rgba(23, 33, 29, 0.08), 0 8px 24px rgba(23, 33, 29, 0.08);
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --aika-primary: #6FDDBC;
      --aika-primary-dark: #42B998;
      --aika-turquoise: #4FC7C0;
      --aika-bg: #0D1318;
      --aika-card: #16211D;
      --aika-text: #EAF3F0;
      --aika-text-variant: #A8B6B0;
      --aika-text-disabled: #6C7A75;
      --aika-outline: #33413C;
      --aika-outline-variant: #263430;
      --aika-secondary-container: #1C2A25;
      --aika-error: #FFB4AB;
      --aika-error-container: #4C0F0C;
      color-scheme: dark;
    }
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
  }

  [hidden] {
    display: none !important;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--aika-bg);
    color: var(--aika-text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  a {
    color: inherit;
  }

  button {
    font: inherit;
  }

  .page {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* Header */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--aika-outline-variant);
    background: var(--aika-card);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .brand-logo {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    display: block;
  }

  .brand-name {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .lang-switch {
    display: flex;
    gap: 4px;
    background: var(--aika-secondary-container);
    border-radius: 999px;
    padding: 3px;
  }

  .lang-btn {
    border: none;
    background: transparent;
    color: var(--aika-text-variant);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 5px 11px;
    border-radius: 999px;
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  .lang-btn:hover {
    color: var(--aika-text);
  }

  .lang-btn[aria-pressed="true"] {
    background: var(--aika-card);
    color: var(--aika-primary-dark);
    box-shadow: var(--aika-shadow);
  }

  .lang-btn:focus-visible,
  button:focus-visible,
  a:focus-visible {
    outline: 2px solid var(--aika-primary);
    outline-offset: 2px;
  }

  /* Main content */
  .content {
    flex: 1;
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 20px 40px;
  }

  .hero {
    text-align: center;
    margin-bottom: 22px;
  }

  .page-title {
    font-size: 1.5rem;
    font-weight: 800;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .page-desc {
    margin: 0;
    color: var(--aika-text-variant);
    font-size: 0.95rem;
  }

  /* State blocks (loading / empty / error) */
  .state-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 14px;
    padding: 48px 20px;
    color: var(--aika-text-variant);
  }

  .state-icon {
    width: 48px;
    height: 48px;
    color: var(--aika-primary);
  }

  .error-state .state-icon {
    color: var(--aika-error);
  }

  .state-block p {
    margin: 0;
    font-size: 0.95rem;
    max-width: 320px;
  }

  .spinner {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 3px solid var(--aika-outline-variant);
    border-top-color: var(--aika-primary);
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .spinner {
      animation-duration: 1.6s;
    }
    * {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
    }
  }

  /* Files summary */
  .files-section {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .files-summary {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px 22px;
    padding: 16px 18px;
    background: var(--aika-card);
    border: 1px solid var(--aika-outline-variant);
    border-radius: var(--aika-radius-md);
    box-shadow: var(--aika-shadow);
  }

  .summary-item {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .summary-value {
    font-size: 1.15rem;
    font-weight: 800;
  }

  .summary-label {
    font-size: 0.75rem;
    color: var(--aika-text-variant);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .btn-primary {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: none;
    border-radius: 999px;
    padding: 10px 20px;
    font-size: 0.9rem;
    font-weight: 700;
    color: #ffffff;
    background: linear-gradient(135deg, var(--aika-primary) 0%, var(--aika-turquoise) 100%);
    cursor: pointer;
    box-shadow: var(--aika-shadow);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    white-space: nowrap;
  }

  .btn-primary:hover {
    box-shadow: var(--aika-shadow-hover);
    transform: translateY(-1px);
  }

  .btn-primary:active {
    transform: translateY(0);
  }

  .btn-primary svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  /* File grid */
  .file-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px;
  }

  .file-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--aika-card);
    border: 1px solid var(--aika-outline-variant);
    border-radius: var(--aika-radius-sm);
    box-shadow: var(--aika-shadow);
    transition: box-shadow 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
    min-width: 0;
  }

  .file-card:hover {
    box-shadow: var(--aika-shadow-hover);
    border-color: var(--aika-outline);
  }

  .file-icon {
    width: 42px;
    height: 42px;
    border-radius: var(--aika-radius-sm);
    background: var(--aika-secondary-container);
    color: var(--aika-primary-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .file-icon svg {
    width: 22px;
    height: 22px;
  }

  .file-info {
    min-width: 0;
    flex: 1;
  }

  .file-name {
    margin: 0;
    font-size: 0.9rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .file-meta {
    margin: 2px 0 0;
    font-size: 0.78rem;
    color: var(--aika-text-variant);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .file-ext {
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 0.03em;
  }

  .file-download-btn {
    flex-shrink: 0;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--aika-outline-variant);
    background: var(--aika-secondary-container);
    color: var(--aika-primary-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background-color 0.15s ease, transform 0.1s ease, color 0.15s ease;
  }

  .file-download-btn:hover {
    background: var(--aika-primary);
    color: #ffffff;
  }

  .file-download-btn:active {
    transform: scale(0.94);
  }

  .file-download-btn svg {
    width: 18px;
    height: 18px;
  }

  .file-card.is-done .file-download-btn {
    background: var(--aika-primary);
    color: #ffffff;
  }

  /* Single-file emphasis: same card style, just centered as a standalone block */
  .file-grid.single-file {
    grid-template-columns: 1fr;
    max-width: 420px;
    margin: 0 auto;
    width: 100%;
  }

  /* Network note */
  .network-note {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: var(--aika-secondary-container);
    border-radius: var(--aika-radius-sm);
    color: var(--aika-text-variant);
    font-size: 0.82rem;
  }

  .network-note svg {
    width: 18px;
    height: 18px;
    color: var(--aika-primary-dark);
    flex-shrink: 0;
  }

  /* Status banner (errors surfaced above the file list) */
  .status-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-radius: var(--aika-radius-sm);
    background: var(--aika-error-container);
    color: var(--aika-error);
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 16px;
  }

  .status-banner svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  /* Footer */
  .footer {
    padding: 18px 20px calc(18px + env(safe-area-inset-bottom, 0px));
    text-align: center;
    font-size: 0.75rem;
    color: var(--aika-text-disabled);
  }

  /* Responsive tweaks */
  @media (max-width: 480px) {
    .page-title {
      font-size: 1.3rem;
    }
    .files-summary {
      flex-direction: column;
      align-items: stretch;
    }
    .btn-primary {
      margin-left: 0;
      justify-content: center;
    }
  }
</style>
<script src="main.js" defer></script>
</head>

  <main class="content">
    <div class="hero">
      <h1 class="page-title" data-i18n="title">Réception de fichiers</h1>
      <p class="page-desc" data-i18n="description">Téléchargez les fichiers partagés avec vous</p>
    </div>

    <div id="status-banner" class="status-banner" hidden></div>

    <div id="loading-state" class="state-block">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loading-text" data-i18n="waiting">En attente de réponse…</p>
    </div>

    <div id="empty-state" class="state-block" hidden>
      <svg class="state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 7l1.5-3h15L21 7"/>
        <path d="M3 7v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7"/>
        <path d="M3 7h18"/>
        <path d="M9.5 12h5" stroke-dasharray="0.1 4" stroke-linecap="round"/>
      </svg>
      <p data-i18n="empty">Aucun fichier disponible pour le moment</p>
    </div>

    <div id="error-state" class="state-block" hidden>
      <svg class="state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 8v5"/>
        <path d="M12 16h.01"/>
      </svg>
      <p id="error-text"></p>
    </div>

    <div id="files-section" class="files-section" hidden>
      <div class="files-summary">
        <div class="summary-item">
          <span class="summary-value" id="files-count">0</span>
          <span class="summary-label" data-i18n="filesLabel">Fichiers</span>
        </div>
        <div class="summary-item">
          <span class="summary-value" id="total-size">0 B</span>
          <span class="summary-label" data-i18n="totalSizeLabel">Taille totale</span>
        </div>
        <button type="button" id="download-all-btn" class="btn-primary" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v12"/>
            <path d="M7 10l5 5 5-5"/>
            <path d="M4 19h16"/>
          </svg>
          <span data-i18n="downloadAll">Tout télécharger</span>
        </button>
      </div>

      <div id="file-grid" class="file-grid"></div>

      <div class="network-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12.5a10 10 0 0 1 14 0"/>
          <path d="M8.3 15.8a5.5 5.5 0 0 1 7.4 0"/>
          <path d="M11.6 19a1.9 1.9 0 0 1 .8-.2c.3 0 .6.1.8.2"/>
          <circle cx="12" cy="19.3" r="0.6" fill="currentColor" stroke="none"/>
        </svg>
        <span data-i18n="networkNote">Transfert local et sécurisé — vos fichiers restent sur votre réseau local</span>
      </div>
    </div>
