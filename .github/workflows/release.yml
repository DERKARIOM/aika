name: Release

# Builds and publishes a draft GitHub Release for Aika on Linux (.deb),
# Windows (Inno Setup installer, unsigned) and macOS (.dmg, unsigned).
#
# Triggered by pushing a tag in the strict `vX.Y.Z` format (no pre-release
# suffixes yet). The tag's version must match app/pubspec.yaml exactly, or
# the `validate` job fails fast before any platform build runs.
#
# This replaces the workflow_dispatch-triggered, LocalSend-branded
# release.yml inherited from upstream (Android APK, self-hosted-arm64 .deb,
# AppImage, Windows .zip) — see app/docs/github-actions-release.md for why.

on:
  push:
    tags:
      - "v*.*.*"

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Check tag format
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match the required vX.Y.Z format (pre-release/build suffixes are not supported yet)."
            exit 1
          fi

      - name: Compare tag version with pubspec.yaml
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PUBSPEC_VERSION=$(grep '^version: ' app/pubspec.yaml | sed 's/version: //' | sed 's/\+.*//')
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match app/pubspec.yaml version ($PUBSPEC_VERSION). Bump pubspec.yaml (and support/scripts/compile_windows_exe-inno.iss) first."
            exit 1
          fi
          echo "version=$PUBSPEC_VERSION" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Dependencies (app)
        working-directory: app
        run: flutter pub get

      - name: Dependencies (cargokit - rust_builder)
        working-directory: packages/localsend_isolates/rust_builder/cargokit/build_tool
        run: flutter pub get

      - name: Generate code (build_runner)
        working-directory: app
        run: dart run build_runner build -d

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Upload generated lib/ for platform build jobs
        uses: actions/upload-artifact@v6
        with:
          name: generated-lib
          path: app/lib/*

  build-linux:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Download generated lib/
        uses: actions/download-artifact@v7
        with:
          name: generated-lib
          path: app/lib

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev dpkg-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Dependencies (app)
        working-directory: app
        run: flutter pub get

      - name: Build Linux
        working-directory: app
        run: flutter build linux --release

      - name: Verify build output
        run: |
          if [ ! -f app/build/linux/x64/release/bundle/aika ]; then
            echo "::error::app/build/linux/x64/release/bundle/aika not found — flutter build linux produced no output."
            exit 1
          fi

      - name: Enable flutter_distributor
        run: |
          dart pub global activate flutter_distributor
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Build .deb package
        working-directory: app
        run: flutter_distributor package --platform linux --targets deb

      - name: Find and rename .deb
        id: find_deb
        run: |
          DEB_PATH=$(find app/dist -name "*.deb" | head -n1)
          if [ -z "$DEB_PATH" ]; then
            echo "::error::No .deb file found under app/dist/ after flutter_distributor package."
            exit 1
          fi
          mkdir -p app/dist/release
          cp "$DEB_PATH" "app/dist/release/Aika-v${{ needs.validate.outputs.version }}-linux-x86-64.deb"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-deb
          path: app/dist/release/Aika-v*.deb

  build-windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v6

      - name: Download generated lib/
        uses: actions/download-artifact@v7
        with:
          name: generated-lib
          path: app/lib

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Dependencies (app)
        working-directory: app
        run: flutter pub get

      - name: Build Windows
        working-directory: app
        run: flutter build windows --release

      - name: Verify build output
        shell: bash
        run: |
          if [ ! -f "app/build/windows/x64/runner/Release/aika.exe" ]; then
            echo "::error::app/build/windows/x64/runner/Release/aika.exe not found — flutter build windows produced no output."
            exit 1
          fi

      - name: Bundle Visual C++ runtime DLLs
        shell: pwsh
        run: |
          Copy-Item support\build\windows\x64\msvcp140.dll app\build\windows\x64\runner\Release\
          Copy-Item support\build\windows\x64\vcruntime140.dll app\build\windows\x64\runner\Release\
          Copy-Item support\build\windows\x64\vcruntime140_1.dll app\build\windows\x64\runner\Release\

      - name: Create empty settings.json
        shell: pwsh
        run: '"{}" | Out-File -Encoding utf8 app\build\windows\x64\runner\Release\settings.json'

      - name: Set Inno Setup version to match this release
        shell: pwsh
        run: |
          $version = "${{ needs.validate.outputs.version }}"
          (Get-Content support\scripts\compile_windows_exe-inno.iss) -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$version`"" | Set-Content support\scripts\compile_windows_exe-inno.iss

      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y
          }

      - name: Compile installer (Inno Setup)
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" support\scripts\compile_windows_exe-inno.iss'

      - name: Verify installer exists
        shell: bash
        run: |
          if [ ! -f "dist/Aika-v${{ needs.validate.outputs.version }}-windows-x64-setup.exe" ]; then
            echo "::error::Expected installer not found in dist/"
            ls -la dist || true
            exit 1
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: dist/Aika-v*-windows-x64-setup.exe

  build-macos:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download generated lib/
        uses: actions/download-artifact@v7
        with:
          name: generated-lib
          path: app/lib

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Dependencies (app)
        working-directory: app
        run: flutter pub get

      - name: Build macOS
        working-directory: app
        run: flutter build macos --release

      - name: Verify universal (arm64 + x86_64) binary
        run: |
          APP="app/build/macos/Build/Products/Release/Aika.app"
          if [ ! -d "$APP" ]; then
            echo "::error::$APP not found — flutter build macos produced no output."
            exit 1
          fi
          EXE_NAME=$(defaults read "$(pwd)/$APP/Contents/Info.plist" CFBundleExecutable)
          BIN="$APP/Contents/MacOS/$EXE_NAME"
          echo "Architectures ($BIN):"
          lipo -info "$BIN"
          if ! lipo -info "$BIN" | grep -q "x86_64" || ! lipo -info "$BIN" | grep -q "arm64"; then
            echo "::error::Expected a universal (arm64 + x86_64) binary, got: $(lipo -info "$BIN")"
            exit 1
          fi

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build .dmg (unsigned)
        working-directory: app
        run: ./macos/scripts/build_dmg.sh

      - name: Rename .dmg to release convention
        run: mv app/dist/Aika.dmg "app/dist/Aika-v${{ needs.validate.outputs.version }}-macos-universal.dmg"

      - name: Verify .dmg exists
        run: |
          if [ ! -f "app/dist/Aika-v${{ needs.validate.outputs.version }}-macos-universal.dmg" ]; then
            echo "::error::Expected .dmg not found"
            exit 1
          fi

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-dmg
          path: app/dist/Aika-v*-macos-universal.dmg

  checksums:
    needs: [validate, build-linux, build-windows, build-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Collect assets and compute SHA256SUMS
        run: |
          mkdir -p release-assets
          find artifacts -maxdepth 2 -type f \( -name "*.deb" -o -name "*.exe" -o -name "*.dmg" \) -exec cp {} release-assets/ \;
          cd release-assets
          if [ -z "$(ls -A .)" ]; then
            echo "::error::No release assets found — a platform build must have failed silently."
            exit 1
          fi
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload release assets + checksums
        uses: actions/upload-artifact@v6
        with:
          name: release-assets
          path: release-assets/

  publish-release:
    needs: [validate, checksums]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: release-assets

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Aika v${{ needs.validate.outputs.version }}
          draft: true
          files: release-assets/*
          body: |
            ## Aika v${{ needs.validate.outputs.version }}

            Voir le [CHANGELOG](https://github.com/DERKARIOM/aika/blob/main/CHANGELOG.md) pour le détail des changements.

            ### Installation
            - **Linux (.deb)** : `sudo apt install ./Aika-v${{ needs.validate.outputs.version }}-linux-x86-64.deb`
            - **Windows** : téléchargez et lancez `Aika-v${{ needs.validate.outputs.version }}-windows-x64-setup.exe`. Non signé : Windows SmartScreen affichera un avertissement au premier lancement (« Informations complémentaires » → « Exécuter quand même »).
            - **macOS** : téléchargez et ouvrez le `.dmg`, glissez Aika dans Applications. Non signé/notarié : au premier lancement, faites un clic droit sur Aika.app puis « Ouvrir » pour contourner Gatekeeper.

            ### Vérification (SHA-256)
            Voir `SHA256SUMS.txt` ci-joint.

            ---
            Cette release est créée en brouillon (draft) : vérifiez les binaires avant de la publier.
