name: Release

# Builds and publishes a draft GitHub Release for Aika on Linux (.deb),
# macOS (.dmg, unsigned) and iOS (.ipa, unsigned, built by ios-release.yml
# called as a reusable workflow).
#
# Android is intentionally NOT built here: the Play Store AAB is built and
# signed locally (`flutter build appbundle --release`), so the upload key
# never has to be stored in GitHub secrets.
#
# Windows is NOT built here either: the installer is built locally with
# support/scripts/release_windows.ps1 (Inno Setup, same steps as the former
# build-windows job), then attached by hand to the draft release created
# below, together with its .sha256 file.
#
# Version: app/pubspec.yaml is the single source ("version: X.Y.Z+N").
# Flutter propagates it to every platform (versionName/versionCode,
# CFBundleShortVersionString/CFBundleVersion, Windows FileVersion, Linux
# version.json), and Settings shows it at runtime via package_info_plus.
#
# Triggered by pushing a tag in the strict `vX.Y.Z` format (no pre-release
# suffixes yet). The tag's version must match app/pubspec.yaml exactly, or
# the `validate` job fails fast before any platform build runs.
#
# This replaces the workflow_dispatch-triggered, LocalSend-branded
# release.yml inherited from upstream (Android APK, self-hosted-arm64 .deb,
# AppImage, Windows .zip) — see app/docs/github-actions-release.md for why.

on:
  push:
    tags:
      - "v*.*.*"

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v6

      - name: Check tag format
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match the required vX.Y.Z format (pre-release/build suffixes are not supported yet)."
            exit 1
          fi

      - name: Compare tag version with pubspec.yaml
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PUBSPEC_FULL=$(grep '^version: ' app/pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          PUBSPEC_VERSION="${PUBSPEC_FULL%%+*}"
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match app/pubspec.yaml version ($PUBSPEC_VERSION). Bump pubspec.yaml (and support/scripts/compile_windows_exe-inno.iss) first."
            exit 1
          fi
          if [[ "$PUBSPEC_FULL" != *+* ]]; then
            echo "::error::app/pubspec.yaml (version: $PUBSPEC_FULL) has no build number. Expected X.Y.Z+N (e.g. 1.1.4+18)."
            exit 1
          fi
          BUILD_NUMBER="${PUBSPEC_FULL#*+}"
          if [[ ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Build number '$BUILD_NUMBER' in app/pubspec.yaml must be a positive integer."
            exit 1
          fi
          echo "Releasing Aika $PUBSPEC_VERSION ($BUILD_NUMBER)"
          echo "version=$PUBSPEC_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Dependencies (app)
        working-directory: app
        run: flutter pub get

      - name: Dependencies (cargokit - rust_builder)
        working-directory: packages/localsend_isolates/rust_builder/cargokit/build_tool
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

  build-linux:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6


      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev libsecret-1-dev dpkg-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Dependencies (app)
        working-directory: app
        run: flutter pub get

      - name: Dependencies (cargokit - rust_builder)
        working-directory: packages/localsend_isolates/rust_builder/cargokit/build_tool
        run: flutter pub get

      - name: Build Linux
        working-directory: app
        env:
          CARGOKIT_VERBOSE: "1"
        run: flutter build linux --release

      - name: Verify build output
        run: |
          if [ ! -f app/build/linux/x64/release/bundle/aika ]; then
            echo "::error::app/build/linux/x64/release/bundle/aika not found — flutter build linux produced no output."
            exit 1
          fi

      - name: Enable flutter_distributor
        run: |
          dart pub global activate flutter_distributor
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Build .deb package
        working-directory: app
        run: flutter_distributor package --platform linux --targets deb

      - name: Find and rename .deb
        id: find_deb
        run: |
          DEB_PATH=$(find app/dist -name "*.deb" | head -n1)
          if [ -z "$DEB_PATH" ]; then
            echo "::error::No .deb file found under app/dist/ after flutter_distributor package."
            exit 1
          fi
          mkdir -p app/dist/release
          cp "$DEB_PATH" "app/dist/release/Aika-v${{ needs.validate.outputs.version }}-linux-x86-64.deb"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-deb
          path: app/dist/release/Aika-v*.deb

  build-macos:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6


      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Dependencies (app)
        working-directory: app
        run: flutter pub get

      - name: Dependencies (cargokit - rust_builder)
        working-directory: packages/localsend_isolates/rust_builder/cargokit/build_tool
        run: flutter pub get

      - name: Build macOS
        working-directory: app
        env:
          CARGOKIT_VERBOSE: "1"
        run: flutter build macos --release

      - name: Verify universal (arm64 + x86_64) binary
        run: |
          APP="app/build/macos/Build/Products/Release/Aika.app"
          if [ ! -d "$APP" ]; then
            echo "::error::$APP not found — flutter build macos produced no output."
            exit 1
          fi
          EXE_NAME=$(defaults read "$(pwd)/$APP/Contents/Info.plist" CFBundleExecutable)
          BIN="$APP/Contents/MacOS/$EXE_NAME"
          echo "Architectures ($BIN):"
          lipo -info "$BIN"
          if ! lipo -info "$BIN" | grep -q "x86_64" || ! lipo -info "$BIN" | grep -q "arm64"; then
            echo "::error::Expected a universal (arm64 + x86_64) binary, got: $(lipo -info "$BIN")"
            exit 1
          fi

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build .dmg (unsigned)
        working-directory: app
        run: ./macos/scripts/build_dmg.sh

      - name: Rename .dmg to release convention
        run: mv app/dist/Aika.dmg "app/dist/Aika-v${{ needs.validate.outputs.version }}-macos-universal.dmg"

      - name: Verify .dmg exists
        run: |
          if [ ! -f "app/dist/Aika-v${{ needs.validate.outputs.version }}-macos-universal.dmg" ]; then
            echo "::error::Expected .dmg not found"
            exit 1
          fi

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-dmg
          path: app/dist/Aika-v*-macos-universal.dmg

  build-ios:
    needs: validate
    # Same workflow as the standalone "ios-v*" pipeline: unsigned .ipa,
    # version and build number from pubspec.yaml, app and Share Extension
    # versions verified. Analyze/test already ran in `validate`.
    uses: ./.github/workflows/ios-release.yml
    with:
      run_checks: false
    # The called workflow declares a "release" job with contents: write
    # (only run for "ios-v*" tags, skipped here). GitHub checks nested
    # permissions before start, so the caller must allow it.
    permissions:
      contents: write

  checksums:
    needs: [validate, build-linux, build-macos, build-ios]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Collect assets and compute SHA256SUMS
        run: |
          mkdir -p release-assets
          find artifacts -maxdepth 2 -type f \( -name "*.deb" -o -name "*.dmg" \) -exec cp {} release-assets/ \;
          IPA=$(find artifacts -maxdepth 2 -type f -name "Aika.ipa" | head -n1)
          if [ -z "$IPA" ]; then
            echo "::error::Aika.ipa not found in the iOS build artifacts."
            exit 1
          fi
          cp "$IPA" "release-assets/Aika-v${{ needs.validate.outputs.version }}-ios-unsigned.ipa"
          cd release-assets
          if [ -z "$(ls -A .)" ]; then
            echo "::error::No release assets found — a platform build must have failed silently."
            exit 1
          fi
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload release assets + checksums
        uses: actions/upload-artifact@v6
        with:
          name: release-assets
          path: release-assets/

  publish-release:
    needs: [validate, checksums]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: release-assets

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Aika v${{ needs.validate.outputs.version }}
          draft: true
          files: release-assets/*
          body: |
            ## Aika v${{ needs.validate.outputs.version }}

            Version **${{ needs.validate.outputs.version }} (${{ needs.validate.outputs.build_number }})**

            Voir le [CHANGELOG](https://github.com/DERKARIOM/aika/blob/main/CHANGELOG.md) pour le détail des changements.

            ### Installation
            - **Linux (.deb)** : `sudo apt install ./Aika-v${{ needs.validate.outputs.version }}-linux-x86-64.deb`
            - **Windows** : téléchargez et lancez `Aika-v${{ needs.validate.outputs.version }}-windows-x64-setup.exe` (empreinte SHA-256 dans le fichier `.sha256` joint). Non signé : Windows SmartScreen affichera un avertissement au premier lancement (« Informations complémentaires » → « Exécuter quand même »).
            - **macOS** : téléchargez et ouvrez le `.dmg`, glissez Aika dans Applications. Non signé/notarié : au premier lancement, faites un clic droit sur Aika.app puis « Ouvrir » pour contourner Gatekeeper.
            - **iOS** : `Aika-v${{ needs.validate.outputs.version }}-ios-unsigned.ipa` n'est pas signé ; il doit être re-signé via Sideloadly ou AltStore (voir `app/docs/IOS_RELEASE.md`).
            - **Android** : disponible sur le Google Play Store.

            ### Vérification (SHA-256)
            Voir `SHA256SUMS.txt` ci-joint.

            ---
            Cette release est créée en brouillon (draft) : vérifiez les binaires avant de la publier.
