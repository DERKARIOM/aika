<style>
  :root {
    --aika-primary: #42B998;
    --aika-bg: #F8FAF9;
    --aika-card: #FFFFFF;
    --aika-text: #17211D;
    --aika-text-variant: #5F6B66;
    --aika-outline-variant: #E1E8E4;
    --aika-error: #BA1A1A;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --aika-bg: #0D1318;
      --aika-card: #16211D;
      --aika-text: #EAF3F0;
      --aika-text-variant: #A8B6B0;
      --aika-outline-variant: #263430;
      --aika-error: #FFB4AB;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--aika-bg);
    color: var(--aika-text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--aika-card);
    border: 1px solid var(--aika-outline-variant);
    border-radius: 20px;
    padding: 36px 28px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 1px 2px rgba(23, 33, 29, 0.06), 0 4px 16px rgba(23, 33, 29, 0.05);
  }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 18px;
  }
  .brand img {
    width: 26px;
    height: 26px;
  }
  .brand span {
    font-weight: 700;
    font-size: 0.95rem;
  }
  .icon {
    width: 44px;
    height: 44px;
    color: var(--aika-error);
    margin-bottom: 12px;
  }
  h1 {
    font-size: 1.15rem;
    margin: 0 0 8px;
  }
  p {
    margin: 0;
    color: var(--aika-text-variant);
    font-size: 0.9rem;
  }
</style>
</head>
